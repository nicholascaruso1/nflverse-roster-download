name: Download nflverse weekly rosters

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/download-rosters.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download official weekly roster CSVs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          : > data/SHA256SUMS.txt

          for year in $(seq 2002 2025); do
            file="roster_weekly_${year}.csv"
            url="https://github.com/nflverse/nflverse-data/releases/download/weekly_rosters/${file}"

            echo "Downloading ${file}"
            curl --fail --location --retry 3 \
              --output "data/${file}" "${url}"

            test -s "data/${file}"
            head -c 4096 "data/${file}" | grep -q ","
            sha256sum "data/${file}" >> data/SHA256SUMS.txt
          done

          printf "season,filename,bytes\n" > data/manifest.csv

          for year in $(seq 2002 2025); do
            file="roster_weekly_${year}.csv"
            bytes=$(stat -c%s "data/${file}")
            printf "%s,%s,%s\n" "$year" "$file" "$bytes" >> data/manifest.csv
          done

          tar -czf nflverse_weekly_rosters_2002_2025.tar.gz -C data .

      - name: Upload roster archive
        uses: actions/upload-artifact@v4
        with:
          name: nflverse-weekly-rosters-2002-2025
          path: |
            nflverse_weekly_rosters_2002_2025.tar.gz
            data/manifest.csv
            data/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
